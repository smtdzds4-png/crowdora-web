<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowdora</title>
<meta name="description" content="Crowdora — predict where stocks are heading and see what the crowd thinks.">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1117;
    color: #C9D1D9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .badge {
    display: inline-block;
    background: #0C2D6B;
    border: 1px solid #2F81F7;
    color: #2F81F7;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 44px;
    margin: 0 0 10px;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }
  .tagline {
    color: #8B949E;
    font-size: 17px;
    margin: 0 0 36px;
  }
  nav a {
    color: #2F81F7;
    text-decoration: none;
    font-size: 15px;
    margin: 0 12px;
    display: inline-block;
    padding: 6px 0;
  }
  nav a:hover { text-decoration: underline; }
  .note {
    color: #484F58;
    font-size: 12px;
    margin-top: 44px;
    line-height: 1.6;
  }
  @media (max-width: 480px) {
    h1 { font-size: 34px; }
    nav a { display: block; margin: 10px 0; }
  }
</style>
</head>
<body>
  <div>
    <div class="badge">BETA</div>
    <h1>Crowdora</h1>
    <p class="tagline">Predict the market. See what the crowd thinks.</p>

    <nav>
      <a href="terms.html">Terms of Use</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="mailto:destek@crowdora.app">Contact</a>
    </nav>

    <p class="note">
      Crowdora is a prediction game and does not provide investment advice.<br>
      &copy; 2026 Crowdora
    </p>
  </div>
</body>
</html>
