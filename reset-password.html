<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Crowdora</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1117;
    color: #C9D1D9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #161B22;
    border: 1px solid #30363D;
    border-radius: 16px;
    padding: 32px 26px;
  }
  h1 { color: #fff; font-size: 24px; margin: 0 0 6px; text-align: center; }
  .sub { color: #8B949E; font-size: 14px; text-align: center; margin: 0 0 26px; }
  label { display: block; color: #8B949E; font-size: 13px; margin-bottom: 6px; }
  input {
    width: 100%;
    background: #0D1117;
    border: 1px solid #30363D;
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    font-size: 16px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #2F81F7; }
  button {
    width: 100%;
    background: #2F81F7;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { border-radius: 10px; padding: 13px; font-size: 14px; margin-bottom: 18px; display: none; }
  .msg.err { background: #2D1215; border: 1px solid #F85149; color: #F85149; }
  .msg.ok  { background: #0D2818; border: 1px solid #3FB950; color: #3FB950; }
  .hint { color: #484F58; font-size: 12px; text-align: center; margin-top: 20px; line-height: 1.6; }
  a { color: #2F81F7; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Reset your password</h1>
  <p class="sub">Enter a new password for your Crowdora account.</p>

  <div id="msg" class="msg"></div>

  <div id="form">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters">

    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Repeat it">

    <button id="btn">Update password</button>
  </div>

  <p class="hint">
    After updating, open the Crowdora app and sign in with your new password.<br>
    Need help? <a href="mailto:destek@crowdora.app">destek@crowdora.app</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Anon key istemci tarafında kullanılmak üzere tasarlanmıştır;
  // RLS ve sunucu fonksiyonları asıl korumayı sağlar.
  const SUPABASE_URL = 'https://htawoemgeqakmttzanhl.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0YXdvZW1nZXFha210dHphbmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDgzNDcsImV4cCI6MjEwMjEyNDM0N30.Uvw_Y9hmrifSGZLmwtzLId9cP_LA_sthbOriRjIvU0o';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { detectSessionInUrl: true, flowType: 'pkce' }
  });

  const msg = document.getElementById('msg');
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
    msg.style.display = 'block';
  }

  // Supabase linkteki token'ı otomatik işler; oturum kurulmuşsa
  // şifre değiştirilebilir demektir.
  let ready = false;

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || session) ready = true;
  });

  (async () => {
    // Hash tabanlı eski linkler için de kontrol
    const { data } = await sb.auth.getSession();
    if (data?.session) ready = true;

    setTimeout(() => {
      if (!ready) {
        show('This reset link is invalid or has expired. Please request a new one from the app.', 'err');
        form.style.display = 'none';
      }
    }, 1500);
  })();

  btn.addEventListener('click', async () => {
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw.length < 6) { show('Password must be at least 6 characters.', 'err'); return; }
    if (pw !== pw2)    { show('Passwords do not match.', 'err'); return; }

    btn.disabled = true;
    btn.textContent = 'Updating…';

    const { error } = await sb.auth.updateUser({ password: pw });

    btn.disabled = false;
    btn.textContent = 'Update password';

    if (error) { show(error.message, 'err'); return; }

    show('Password updated. You can now sign in to the Crowdora app.', 'ok');
    form.style.display = 'none';
  });
</script>
</body>
</html>
